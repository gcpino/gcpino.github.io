<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cesp-title cesp-desc" id="cesp-architecture-root">
  <title id="cesp-title">c-esp Architecture Diagram</title>
  <desc id="cesp-desc">Architecture showing in-place RFC 4303 / RFC 7634 ESP frame layout, two-phase RFC 6479 1024-bit ESN anti-replay and rx_sa_ring[4] rollover engine, and constant-time dudect and channel verification gate.</desc>

  <defs>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(90,75,55,0.08)" />
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a7e6b" />
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b25d3b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f0" />
  <rect width="100%" height="100%" fill="url(#grid-dots)" />

  <rect x="20" y="30" width="265" height="420" rx="6" fill="#f4ebd9" stroke="#d5cbba" stroke-width="0.9" />
  <rect x="34" y="23" width="225" height="15" rx="2" fill="#eae2ce" stroke="#d5cbba" stroke-width="0.7" />
  <text x="146" y="34" fill="#6e6557" font-size="7.2" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.11em">1. IN-PLACE RFC 4303 / 7634 FRAME ENGINE</text>

  <rect x="310" y="30" width="380" height="420" rx="6" fill="#f4ebd9" stroke="#d5cbba" stroke-width="0.9" />
  <rect x="324" y="23" width="340" height="15" rx="2" fill="#eae2ce" stroke="#d5cbba" stroke-width="0.7" />
  <text x="494" y="34" fill="#6e6557" font-size="7.2" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.11em">2. TWO-PHASE RFC 6479 1024-BIT ESN ANTI-REPLAY &amp; RX_SA_RING[4]</text>

  <rect x="715" y="30" width="265" height="420" rx="6" fill="#f4ebd9" stroke="#d5cbba" stroke-width="0.9" />
  <rect x="729" y="23" width="235" height="15" rx="2" fill="#eae2ce" stroke="#d5cbba" stroke-width="0.7" />
  <text x="846" y="34" fill="#6e6557" font-size="7.2" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.11em">3. CONSTANT-TIME &amp; CHANNEL GATE</text>

  <line x1="152" y1="138" x2="152" y2="180" stroke="#8a7e6b" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="152" y1="258" x2="152" y2="300" stroke="#8a7e6b" stroke-width="1.2" marker-end="url(#arrow)" />

  <path d="M 255,340 H 285 Q 295,340 295,220 V 125 Q 295,115 305,115 H 335" fill="none" stroke="#b25d3b" stroke-width="1.3" marker-end="url(#arrow-accent)" />
  <rect x="260" y="212" width="74" height="16" rx="2" fill="#fcfbfa" stroke="#c9bfab" stroke-width="0.8" />
  <text x="297" y="223" fill="#b25d3b" font-family="'Geist Mono', monospace" font-size="7.2" font-weight="600" text-anchor="middle">spi &amp; 0x3u</text>

  <line x1="500" y1="168" x2="500" y2="202" stroke="#8a7e6b" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="500" y1="286" x2="500" y2="318" stroke="#8a7e6b" stroke-width="1.2" marker-end="url(#arrow)" />

  <path d="M 665,368 H 692 Q 702,368 702,240 V 125 Q 702,115 712,115 H 745" fill="none" stroke="#8a7e6b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="668" y="232" width="66" height="16" rx="2" fill="#fcfbfa" stroke="#c9bfab" stroke-width="0.8" />
  <text x="701" y="243" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="7.2" font-weight="600" text-anchor="middle">0 allocs</text>

  <line x1="847" y1="162" x2="847" y2="212" stroke="#8a7e6b" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="847" y1="292" x2="847" y2="334" stroke="#4f785e" stroke-width="1.3" marker-end="url(#arrow-accent)" />

  <rect x="48" y="68" width="208" height="70" rx="4" fill="#fcfbfa" stroke="#c9bfab" stroke-width="1" />
  <text x="152" y="92" fill="#26221d" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Caller In-Place Arena Buffer</text>
  <text x="152" y="110" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">[16B Headroom][Payload][34B Tail]</text>
  <text x="152" y="124" fill="#918878" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">Tunnel (IP-in-IP) or Transport Mode</text>

  <rect x="48" y="180" width="208" height="78" rx="4" fill="#fcfbfa" stroke="#c9bfab" stroke-width="1" />
  <text x="152" y="204" fill="#26221d" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">RFC 7634 ChaCha20-Poly1305</text>
  <text x="152" y="221" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">96b Nonce: Salt(32b) || IV(64b)</text>
  <text x="152" y="235" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">96b ESN AAD: SPI || SeqH || SeqL</text>
  <text x="152" y="248" fill="#918878" font-family="'Geist Mono', monospace" font-size="7.8" text-anchor="middle">Pluggable esp_crypto_vtable_t</text>

  <rect x="48" y="300" width="208" height="86" rx="4" fill="#fcfbfa" stroke="#c9bfab" stroke-width="1" />
  <text x="152" y="324" fill="#26221d" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">RFC 4303 Wire Frame</text>
  <text x="152" y="341" fill="#b25d3b" font-family="'Geist Mono', monospace" font-size="8.2" font-weight="600" text-anchor="middle">SPI(4B) | SeqLow(4B) | IV(8B)</text>
  <text x="152" y="356" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">Ciphertext + Pad(1..N) + PadLen + NH</text>
  <text x="152" y="371" fill="#48697a" font-family="'Geist Mono', monospace" font-size="8.2" font-weight="600" text-anchor="middle">128-Bit Poly1305 ICV Tag (16B)</text>

  <rect x="335" y="68" width="330" height="100" rx="4" fill="#fbf0e8" stroke="#b25d3b" stroke-width="1.3" />
  <text x="500" y="93" fill="#26221d" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Static Context &amp; O(1) SA Rollover Ring</text>
  <text x="500" y="111" fill="#b25d3b" font-family="'Geist Mono', monospace" font-size="8.8" font-weight="600" text-anchor="middle">sizeof(esp_context_t) == 1944 B (&lt;= 4096 B)</text>
  <text x="500" y="128" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">tx_sa (Outbound) + rx_sa_ring[4] (Make-Before-Break Overlap)</text>
  <text x="500" y="143" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">RFC 4301 Soft/Hard Byte, Packet &amp; Monotonic Time Lifetimes</text>
  <text x="500" y="157" fill="#918878" font-family="'Geist Mono', monospace" font-size="7.8" text-anchor="middle">528B Binary Flight Recorder (esp_trace_ring_t, 32 x 16B)</text>

  <rect x="335" y="202" width="330" height="84" rx="4" fill="#fcfbfa" stroke="#c9bfab" stroke-width="1" />
  <text x="500" y="226" fill="#26221d" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Phase 1: Read-Only ESN &amp; Bitmap Precheck</text>
  <text x="500" y="244" fill="#48697a" font-family="'Geist Mono', monospace" font-size="8.3" font-weight="500" text-anchor="middle">Signed 32b Modular Offset: delta = (int32_t)(seq_low - H_low)</text>
  <text x="500" y="259" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">Inspects uint64_t bitmap[16] (960-pkt span) without mutation</text>
  <text x="500" y="274" fill="#b25d3b" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">Spoofed high-seq frames cannot advance highest_seq</text>

  <rect x="335" y="318" width="330" height="98" rx="4" fill="#fcfbfa" stroke="#c9bfab" stroke-width="1.1" />
  <text x="500" y="342" fill="#26221d" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Phase 2: Constant-Time Verify &amp; RFC 6479 Commit</text>
  <text x="500" y="359" fill="#48697a" font-family="'Geist Mono', monospace" font-size="8.3" font-weight="500" text-anchor="middle">esp_ct_memeq(tag, icv, 16) &rarr; ChaCha20 Decrypt In-Place</text>
  <text x="500" y="374" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">Fixed-Window (16B) Branchless Padding Scan (esp_ct_select_u32)</text>
  <rect x="355" y="386" width="290" height="20" rx="3" fill="#f4ebd9" stroke="#d5cbba" />
  <text x="500" y="399" fill="#b25d3b" font-family="'Geist Mono', monospace" font-size="7.9" font-weight="600" text-anchor="middle">O(1) Block Shift (seq64 &gt;&gt; 6) + DSE-Hardened esp_secure_zero()</text>

  <rect x="745" y="68" width="205" height="94" rx="4" fill="#fcfbfa" stroke="#c9bfab" stroke-width="1" />
  <text x="847" y="92" fill="#26221d" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">IETF Vector &amp; Symbol Gate</text>
  <text x="847" y="110" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">RFC 8439 &sect;2.8.2 + RFC 7634 App A</text>
  <text x="847" y="125" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">nm -u libcesp.a: 0 heap/OS syms</text>
  <text x="847" y="140" fill="#918878" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">DLT_RAW IPv4/ESP PCAP output</text>

  <rect x="745" y="212" width="205" height="80" rx="4" fill="#fcfbfa" stroke="#c9bfab" stroke-width="1" />
  <text x="847" y="236" fill="#26221d" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Constant-Time &amp; Channel Sim</text>
  <text x="847" y="253" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">dudect Welch t-test: |t| &le; 0.42</text>
  <text x="847" y="268" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8.2" text-anchor="middle">Gilbert-Elliott + Gamma Jitter</text>
  <text x="847" y="281" fill="#918878" font-family="'Geist Mono', monospace" font-size="7.8" text-anchor="middle">0.04% drop at &sigma;=128 (vs 68.5% W=64)</text>

  <rect x="745" y="334" width="205" height="76" rx="4" fill="#ebf2ed" stroke="#4f785e" stroke-width="1.3" />
  <text x="847" y="359" fill="#26221d" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Verification Passed</text>
  <text x="847" y="377" fill="#4f785e" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">&check; ALL 5 CI GATES PASS</text>
  <text x="847" y="393" fill="#6e6557" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">DO-178C Traceability Matrix Linked</text>
</svg>
